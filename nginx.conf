# Static server for the svelte-treeview examples showcase (SvelteKit adapter-static).
#
# The site is 100% static (prerendered HTML + hashed _app/ assets + a couple of
# static files, no backend), so the vulnerability scanners that constantly probe
# public hosts (leakix/l9scan et al. hitting /api, /.env, /wp-login, /telescope,
# config.json, .git, ...) have nothing to exploit — they only spam the logs. Drop
# that traffic silently with 444 (close the connection, no response, no log line).

server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # gzip the text assets (the SvelteKit JS/CSS bundles compress well).
    gzip            on;
    gzip_vary       on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    # 1. Known vulnerability scanners by User-Agent → close immediately.
    if ($http_user_agent ~* "(l9scan|leakix|nikto|sqlmap|nmap|masscan|zgrab|censys|nuclei|httpx|semrush|petalbot)") {
        return 444;
    }

    # 2. Exploit-probe file extensions this static site never serves.
    location ~* \.(php|phtml|asp|aspx|jsp|cgi|pl|env|ini|sh|bak|old|sql)$ {
        access_log off;
        return 444;
    }

    # 3. Exploit-probe paths (app frameworks, VCS/CI metadata, dotfiles).
    location ~* /(\.git|\.svn|\.hg|\.env|wp-admin|wp-login|wp-content|wp-includes|xmlrpc|telescope|actuator|vendor|META-INF|WEB-INF|phpmyadmin|pma|adminer|owa)(/|$) {
        access_log off;
        return 444;
    }

    # 4. Hashed build assets (SvelteKit writes content-hashed files under
    #    _app/immutable/) — safe to cache forever.
    location /_app/immutable/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 5. Everything legitimate: prefer the exact file, then the prerendered
    #    <route>.html, then a directory, finally the SPA fallback (index.html) for
    #    client-only routes. HTML + non-hashed assets (examples-shared.css, favicon)
    #    are revalidated each load so a redeploy shows up immediately (cheap 304 via
    #    ETag when unchanged, fresh bytes the moment a new image is deployed).
    location / {
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
