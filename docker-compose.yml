version: '3.8'

services:
  svelte-treeview-showcase:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: svelte-treeview-showcase
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.treeview.rule=Host(`localhost`)"
      - "traefik.http.services.treeview.loadbalancer.server.port=80"